<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor — Zooms panel, light mode (laptop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}a{color:#5F45F0}a:hover{color:#4A34C9}</style>
</helmet>
<div style="width: 1280px; height: 800px; border-radius: 12px; overflow: hidden">
  <dc-import name="Main" theme="light" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
