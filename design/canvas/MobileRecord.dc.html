<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record on mobile — ready and recording states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.ss{--bg:#F2F2F5;--panel:#FFFFFF;--panel2:#F6F6F8;--line:#E2E2E8;--line2:#CFCFD7;--text:#17171B;--text2:#5A5A64;--text3:#6F6F7A;--accent:#5F45F0;--accentSoft:#ECE8FF;--onAccent:#FFFFFF;--rec:#E0393E;--caption:#2A9D5E;--danger:#D14343;--focus:0 0 0 3px rgba(95,69,240,.35)}
.ss.dark{--bg:#0E0F11;--panel:#161719;--panel2:#1C1D21;--line:#2A2B31;--line2:#383943;--text:#EDEDF2;--text2:#A6A7B1;--text3:#8E8F9A;--accent:#8F79FF;--accentSoft:#2A2546;--onAccent:#0E0F11;--rec:#FF4A4F;--caption:#45C77F;--danger:#E36060;--focus:0 0 0 3px rgba(143,121,255,.4)}
.ss *{box-sizing:border-box}
.ss button{font:inherit;color:inherit;cursor:pointer}
.ss button:focus-visible,.ss input:focus-visible,.ss a:focus-visible{outline:none;box-shadow:var(--focus)}
.ss .ic{width:22px;height:22px;flex:none}
a{color:#5F45F0}a:hover{color:#4A34C9}
</style>
</helmet>
<div class="ss {{themeClass}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--text); font-size: 15px; display: flex; flex-direction: column; overflow: hidden; border-radius: 44px; position: relative">
  <header style="padding: 58px 20px 8px; display: flex; align-items: center; gap: 10px">
    <a href="MobileHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--text)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">{{ title }}</h1>
    <div style="flex: 1 1 auto"></div>
    <button aria-label="Recording settings" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12l2-1.5-2-3.5-2.4.9a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.5a7 7 0 0 0-2 1.2L5 5.8l-2 3.5 2 1.5v2.4l-2 1.5 2 3.5 2.4-.9a7 7 0 0 0 2 1.2L10 21h4l.5-2.5a7 7 0 0 0 2-1.2l2.4.9 2-3.5-2-1.5z"/></svg></button>
  </header>

  <!-- Source -->
  <div role="tablist" aria-label="What to record" style="margin: 4px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{ s.on }}" onClick="{{ s.pick }}" style="height: 64px; border-radius: 14px; border: 2px solid {{ s.border }}; background: {{ s.bg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="{{ s.d }}"/></svg>{{ s.name }}</button>
    </sc-for>
  </div>
  <p style="margin: 8px 20px 0; font-size: 12px; color: var(--text3)">{{ hint }}</p>

  <!-- Preview -->
  <div style="margin: 12px 20px 0; flex: 1 1 auto; min-height: 0; border-radius: 18px; overflow: hidden; position: relative; background: radial-gradient(circle at 70% 30%, #6b4bd6 0%, #2b1d6b 40%, #0b0a1f 100%)">
    <div aria-hidden="true" style="position: absolute; inset: 10% 14%; border-radius: 14px; background: #1f2026; border: 1px solid rgba(255,255,255,.12)"></div>
    <sc-if value="{{ recording }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 14px; top: 14px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--rec)"></span><span style="font-variant-numeric: tabular-nums; font-weight: 600">00:42</span><span style="opacity: .7">· 1 flag</span></div>
    </sc-if>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 14px; top: 14px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px">Preview · camera and mic are not captured here</div>
    </sc-if>
    <div style="position: absolute; right: 14px; bottom: 14px; width: 84px; height: 84px; border-radius: 24%; background: linear-gradient(160deg, #e9c1a3, #a16a4c); border: 2px solid rgba(255,255,255,.3)"></div>
    <sc-if value="{{ recording }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 14px; right: 112px; bottom: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(20,20,28,.82); color: #fff; font-size: 13px; line-height: 1.45"><span style="display: block; font-size: 10px; color: rgba(255,255,255,.65); margin-bottom: 4px">Speaker notes · scrolling</span>Welcome everyone. Today we set up billing, add a second device…</div>
    </sc-if>
  </div>

  <!-- Devices row -->
  <div style="margin: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button aria-haspopup="listbox" style="height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 10px; color: var(--text3)">Camera</span><span style="font-size: 12px; font-weight: 500">Front</span></button>
    <button aria-haspopup="listbox" style="height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 10px; color: var(--text3)">Microphone</span><span style="font-size: 12px; font-weight: 500">AirPods</span><span aria-hidden="true" style="width: 60%; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--caption) 0 55%, var(--line2) 55%)"></span></button>
    <button aria-pressed="true" style="height: 56px; border-radius: 14px; border: 1px solid var(--accent); background: var(--accentSoft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 10px; color: var(--text3)">System audio</span><span style="font-size: 12px; font-weight: 500">On</span></button>
  </div>
  <div style="margin: 8px 20px 0; display: flex; gap: 8px; overflow: hidden">
    <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line2); background: var(--panel); font-size: 12px; white-space: nowrap">Countdown 3 s ▾</button>
    <button aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--accent); background: var(--accentSoft); font-size: 12px; white-space: nowrap">Speaker notes</button>
    <button aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--accent); background: var(--accentSoft); font-size: 12px; white-space: nowrap">Quick export</button>
  </div>

  <!-- Controls -->
  <div style="padding: 14px 20px 36px; display: flex; align-items: center; justify-content: center; gap: 18px">
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
      <span style="width: 56px"></span>
      <button onClick="{{ start }}" aria-label="Start recording" style="width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--panel); box-shadow: 0 0 0 3px var(--rec); background: var(--rec); display: grid; place-items: center"><span style="width: 26px; height: 26px; border-radius: 50%; background: #fff"></span></button>
      <span style="width: 56px; font-size: 11px; color: var(--text3); text-align: center">or press the side button twice</span>
    </sc-if>
    <sc-if value="{{ recording }}" hint-placeholder-val="{{ false }}">
      <button aria-label="Pause" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
      <button onClick="{{ stop }}" aria-label="Stop recording" style="width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--panel); box-shadow: 0 0 0 3px var(--rec); background: var(--rec); display: grid; place-items: center"><span style="width: 28px; height: 28px; border-radius: 6px; background: #fff"></span></button>
      <button aria-label="Add recording flag" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21V4h12l-3 4 3 4H5"/></svg></button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { src:'phone', rec:false }; }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const S = this.state.src, rec = this.state.rec;
    const defs = [
      ['phone','This phone','M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM11 18h2','Records this screen like a screen recording. Taps are captured as cursor clicks for automatic zooms.'],
      ['mac','My Mac','M3 5h18v12H3zM8 21h8M12 17v4','Remote control for the Mac app on the same network: start, stop, pause and flag from here.'],
      ['camera','Camera only','M4 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4zM17 10l4-2v8l-4-2','A talking-head clip with the same look: background, padding and captions.']
    ];
    const sources = defs.map(([id,name,d]) => ({ id, name, d, on: S===id, border: S===id?'var(--accent)':'var(--line)', bg: S===id?'var(--accentSoft)':'var(--panel)', pick: () => this.setState({src:id}) }));
    return {
      themeClass: theme==='light'?'light':'dark', sources, hint: defs.find(x=>x[0]===S)[3],
      ready: !rec, recording: rec, title: rec ? 'Recording' : 'New recording',
      start: () => this.setState({rec:true}), stop: () => this.setState({rec:false})
    };
  }
}
</script>
</body>
</html>
