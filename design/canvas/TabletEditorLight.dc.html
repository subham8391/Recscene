<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor on tablet, light mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}a{color:#5F45F0}a:hover{color:#4A34C9}</style>
</helmet>
<div style="width: 1024px; height: 768px; border-radius: 18px; overflow: hidden">
  <dc-import name="TabletEditor" theme="light" hint-size="1024px,768px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
