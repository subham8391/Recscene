<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor on mobile — single column with bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.ss{--bg:#F2F2F5;--panel:#FFFFFF;--panel2:#F6F6F8;--line:#E2E2E8;--line2:#CFCFD7;--text:#17171B;--text2:#5A5A64;--text3:#6F6F7A;--accent:#5F45F0;--accentSoft:#ECE8FF;--onAccent:#FFFFFF;--zoom:#6F57F2;--clip:#D9A41C;--layout:#DF4F80;--mask:#1E9A9A;--shortcut:#2F7FE0;--caption:#2A9D5E;--voice:#E0692A;--danger:#D14343;--stage:#E6E6EC;--scrim:rgba(20,20,30,.35);--shadow:0 -12px 40px rgba(20,20,35,.18);--focus:0 0 0 3px rgba(95,69,240,.35)}
.ss.dark{--bg:#0E0F11;--panel:#161719;--panel2:#1C1D21;--line:#2A2B31;--line2:#383943;--text:#EDEDF2;--text2:#A6A7B1;--text3:#8E8F9A;--accent:#8F79FF;--accentSoft:#2A2546;--onAccent:#0E0F11;--zoom:#8F79FF;--clip:#F2C14E;--layout:#F06A98;--mask:#34BFBF;--shortcut:#5EA0F7;--caption:#45C77F;--voice:#F58D4D;--danger:#E36060;--stage:#07070A;--scrim:rgba(0,0,0,.55);--shadow:0 -12px 40px rgba(0,0,0,.6);--focus:0 0 0 3px rgba(143,121,255,.4)}
.ss *{box-sizing:border-box}
.ss button{font:inherit;color:inherit;cursor:pointer}
.ss button:focus-visible,.ss input:focus-visible,.ss a:focus-visible{outline:none;box-shadow:var(--focus)}
.ss .ic{width:22px;height:22px;flex:none}
.ss h3{margin:0;font-size:12px;font-weight:600;color:var(--text2)}
a{color:#5F45F0}a:hover{color:#4A34C9}
</style>
</helmet>
<div class="ss {{themeClass}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--text); font-size: 15px; display: flex; flex-direction: column; overflow: hidden; border-radius: 44px; position: relative">

  <header style="padding: 54px 12px 6px; display: flex; align-items: center; gap: 6px">
    <a href="MobileHome.dc.html" aria-label="Back to projects" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--text)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span style="font-weight: 600; font-size: 14px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Area 2026-11-14 00:12</span>
    <div style="flex: 1 1 auto"></div>
    <button aria-label="Undo" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <a href="MobileExport.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--onAccent); font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center">Export</a>
  </header>

  <!-- Preview -->
  <div style="margin: 0 12px; height: 206px; border-radius: 14px; overflow: hidden; position: relative; background: linear-gradient(135deg, #1b2b5a 0%, #5a3a8a 45%, #c9608a 100%)">
    <div aria-hidden="true" style="position: absolute; inset: 9% 10%; border-radius: 8px; background: #1f2026; border: 1px solid rgba(255,255,255,.12)"></div>
    <div aria-hidden="true" style="position: absolute; right: 7%; bottom: 9%; width: 54px; height: 54px; border-radius: 25%; background: linear-gradient(160deg, #e9c1a3, #a16a4c); border: 2px solid rgba(255,255,255,.25)"></div>
    <span aria-hidden="true" style="position: absolute; left: 46%; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--zoom); box-shadow: 0 0 0 4px rgba(143,121,255,.35)"></span>
    <div style="position: absolute; left: 10px; top: 10px; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px">16:9 · 1080p</div>
    <button aria-label="Full screen preview" style="position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 8px; border: none; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:16px;height:16px"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <!-- Transport -->
  <div style="margin: 8px 12px 0; display: flex; align-items: center; gap: 8px">
    <span style="font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px">00:12.4</span><span style="color: var(--text3); font-size: 13px">/ 01:48.0</span>
    <div style="flex: 1 1 auto"></div>
    <button aria-label="Back 1 s" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></svg></button>
    <button aria-label="Play" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--text); color: var(--bg); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg></button>
    <button aria-label="Forward 1 s" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 6v12l8-6zM4 6v12l8-6z"/></svg></button>
    <div style="flex: 1 1 auto"></div>
    <button aria-label="Cut at playhead" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="width:18px;height:18px"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5L20 19M8.5 16.5L20 5"/></svg></button>
  </div>

  <!-- Scrubber strip -->
  <section aria-label="Timeline" style="margin: 8px 12px 0; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); overflow: hidden">
    <div style="height: 18px; display: flex; font-size: 10px; color: var(--text3); border-bottom: 1px solid var(--line); padding: 0 2px"><sc-for list="{{ruler}}" as="m" hint-placeholder-count="5"><span style="flex: 1 1 0; border-left: 1px solid var(--line2); padding-left: 4px; line-height: 18px">{{ m }}</span></sc-for></div>
    <div style="position: relative; padding: 6px 0 4px">
      <sc-for list="{{tracks}}" as="t" hint-placeholder-count="4">
        <div style="height: 16px; position: relative; margin: 2px 0">
          <span style="position: absolute; left: 4px; top: 0; font-size: 9px; color: var(--text3); line-height: 16px; width: 44px">{{ t.name }}</span>
          <sc-for list="{{ t.items }}" as="it" hint-placeholder-count="3"><span style="position: absolute; left: calc(48px + (100% - 52px) * {{ it.l }}); width: calc((100% - 52px) * {{ it.w }}); top: 2px; height: 12px; border-radius: 4px; background: {{ t.color }}; opacity: {{ it.o }}"></span></sc-for>
        </div>
      </sc-for>
      <div aria-hidden="true" style="position: absolute; left: calc(48px + (100% - 52px) * 0.115); top: 0; bottom: 0; width: 2px; background: var(--text)"><span style="position: absolute; top: -4px; left: -7px; width: 16px; height: 16px; border-radius: 8px 8px 8px 0; background: var(--text); transform: rotate(-45deg)"></span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 8px; border-top: 1px solid var(--line)">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: var(--zoom)"></span>
      <span style="font-size: 12px; font-weight: 600">Zoom 2 · Auto · 2.0×</span>
      <span style="font-size: 11px; color: var(--text3)">00:11.2–00:14.8</span>
      <div style="flex: 1 1 auto"></div>
      <button onClick="{{ openZoom }}" style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-size: 12px; font-weight: 600">Edit</button>
    </div>
  </section>

  <!-- Quick actions -->
  <div style="margin: 10px 12px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button style="height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--zoom); font-weight: 600; font-size: 13px">+ Zoom</button>
    <button style="height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--layout); font-weight: 600; font-size: 13px">+ Layout</button>
    <button style="height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--mask); font-weight: 600; font-size: 13px">+ Mask</button>
  </div>

  <div style="flex: 1 1 auto"></div>

  <!-- Tab bar -->
  <nav aria-label="Editor panels" style="height: 84px; padding: 8px 6px 24px; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <button onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; border: none; background: transparent; color: {{ t.fg }}; font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="{{ t.d }}"/></svg>{{ t.name }}</button>
    </sc-for>
  </nav>

  <!-- Bottom sheet -->
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" onClick="{{ closeSheet }}" style="position: absolute; inset: 0; background: var(--scrim)"></div>
    <section role="dialog" aria-label="Zoom settings" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%; border-radius: 24px 24px 0 0; background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden">
      <div style="display: grid; place-items: center; padding: 8px 0 0"><span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: var(--line2)"></span></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; border-bottom: 1px solid var(--line)"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--zoom)"></span><span style="font-weight: 700">Zoom</span><span style="color: var(--text3); font-size: 13px">2 of 7</span><div style="flex: 1 1 auto"></div><button onClick="{{ closeSheet }}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: var(--panel2); font-weight: 600; font-size: 13px">Done</button></div>
      <div style="overflow: auto; padding: 14px 16px 36px; display: flex; flex-direction: column; gap: 16px">
        <section style="display: flex; flex-direction: column; gap: 8px"><h3>Zoom style</h3>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button aria-pressed="true" style="height: 56px; border-radius: 14px; border: 2px solid var(--accent); background: var(--panel2); font-weight: 500">Classic</button><button style="height: 56px; border-radius: 14px; border: 2px solid var(--line2); background: var(--panel2); font-weight: 500">Glass Loupe</button></div>
        </section>
        <section style="display: flex; flex-direction: column; gap: 8px"><h3>Zoom position</h3>
          <div role="group" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line2); border-radius: 12px; overflow: hidden"><button style="height: 44px; border: none; background: var(--accentSoft); font-weight: 600">Auto</button><button style="height: 44px; border: none; border-left: 1px solid var(--line2); background: var(--panel2); color: var(--text2)">Manual</button></div>
          <p style="margin: 0; font-size: 12px; color: var(--text3)">Manual: drag the dot on the preview.</p>
        </section>
        <section style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between"><label for="mz" style="font-size: 12px; font-weight: 600; color: var(--text2)">Zoom level</label><span style="font-size: 14px; font-weight: 600">200%</span></div>
          <input id="mz" type="range" min="100" max="400" value="200" style="width: 100%; height: 44px; accent-color: var(--accent)">
        </section>
        <section style="display: flex; flex-direction: column; gap: 4px; padding: 4px 12px; border-radius: 14px; background: var(--panel2)">
          <label style="display: flex; align-items: center; justify-content: space-between; min-height: 48px"><span style="font-weight: 500; font-size: 14px">Instant animation</span><input type="checkbox" style="width: 48px; height: 28px; accent-color: var(--accent)"></label>
          <label style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-top: 1px solid var(--line)"><span style="font-weight: 500; font-size: 14px">Start animation early</span><input type="checkbox" checked style="width: 48px; height: 28px; accent-color: var(--accent)"></label>
        </section>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button style="height: 48px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; font-size: 14px">Split</button><button style="height: 48px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; font-size: 14px">Duplicate</button><button style="height: 48px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; font-size: 14px">Apply level to all</button><button style="height: 48px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; font-size: 14px; color: var(--danger)">Remove</button></div>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"sheet":{"editor":"enum","options":["none","zoom"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sheet: null, tab:'zooms' }; }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const open = this.state.sheet === null ? (this.props.sheet ?? 'none') === 'zoom' : this.state.sheet;
    const tracks = [
      {name:'Zooms', color:'var(--zoom)', items:[{l:0.04,w:0.07,o:.85},{l:0.105,w:0.033,o:1},{l:0.22,w:0.09,o:.85},{l:0.40,w:0.06,o:.85},{l:0.76,w:0.08,o:.85}]},
      {name:'Clips', color:'var(--clip)', items:[{l:0,w:0.31,o:1},{l:0.313,w:0.06,o:1},{l:0.40,w:0.60,o:1}]},
      {name:'Layouts', color:'var(--layout)', items:[{l:0.62,w:0.14,o:1}]},
      {name:'Captions', color:'var(--caption)', items:[{l:0.01,w:0.14,o:.8},{l:0.16,w:0.22,o:.8},{l:0.41,w:0.30,o:.8},{l:0.73,w:0.24,o:.8}]}
    ];
    const tabs = [['zooms','Zooms','M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l5 5M11 8v6M8 11h6'],['clips','Clips','M6 4h12v16H6zM6 9h12M6 14h12'],['camera','Camera','M4 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4zM17 10l4-2v8l-4-2'],['style','Style','M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6'],['audio','Audio','M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2'],['captions','Captions','M4 5h16v14H4zM7 14h6M15 14h2M7 10h2M11 10h6']]
      .map(([id,name,d]) => ({ id,name,d, on: this.state.tab===id, fg: this.state.tab===id?'var(--accent)':'var(--text2)', pick: () => this.setState({ tab:id, sheet: id==='zooms' }) }));
    return {
      themeClass: theme==='light'?'light':'dark', tracks, tabs,
      ruler: ['0:00','0:27','0:54','1:21','1:48'],
      sheetOpen: open, openZoom: () => this.setState({sheet:true}), closeSheet: () => this.setState({sheet:false})
    };
  }
}
</script>
</body>
</html>
