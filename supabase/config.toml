# Local Supabase stack for Recscene accounts (see README.md). Ports are offset
# from the defaults so it runs beside Sparehour's stack.
project_id = "Recscene"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:51797"
# The app's callbacks: development builds listen on the loopback, packaged builds take the deep link.
additional_redirect_urls = ["http://127.0.0.1:51797/auth/callback", "recscene://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false

# Google sign-in (docs/DECISIONS.md 2026-11-18). Needs a Web OAuth client whose
# redirect URI is http://127.0.0.1:55321/auth/v1/callback for the local stack.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
