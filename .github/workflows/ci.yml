name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux keeps the private repo inside the free Actions quota (macOS minutes cost 10×).
  # The Swift helper is skipped there (build:native is macOS-only); it is built and run on the Mac.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
